[project]
name = "descripproypdiic"
version = "0.1.0"
description = "Procesamiento de imágenes de plantas para la detección de plagas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kaggle>=1.6.14",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
